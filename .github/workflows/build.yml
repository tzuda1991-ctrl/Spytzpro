name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        # Ye step ab kaam karega agar gradlew file commit ki hai
        run: chmod +x ./gradlew

      - name: Build Debug APK
        # './' lagana zaroori hai taaki shell samjhe ye current directory ka file hai
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          # Path check karo ki APK actually yahi ban rha hai ya nahi
          # Usually path 'app/build/outputs/apk/debug/' hota hai
          path: app/build/outputs/apk/debug/*.apk
